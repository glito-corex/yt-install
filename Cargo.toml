[package]
name = "YT_install"
version = "1.6.0"
edition = "2021"
build = "build.rs"

[dependencies]
dirs = "5.0"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
]

[build-dependencies]
winresource = "0.1"